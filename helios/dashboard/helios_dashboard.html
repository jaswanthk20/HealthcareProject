<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELIOS Launch Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">

<style>
/* ============================================================ tokens */
:root{
  --ground:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#EAEEF3;
  --line:#D5DCE5; --line-soft:#E6EAF0;
  --ink:#0D131B; --ink-2:#3C4855; --ink-3:#6A7686;
  --accent:#0B6E7D; --accent-2:#0E8A9C; --accent-soft:#DCEDF0; --accent-line:#9FCBD3;
  --good:#1C7048; --good-soft:#DDEEE5; --good-line:#8FC4AA;
  --warn:#94600A; --warn-soft:#F4E8D2; --warn-line:#D4B375;
  --crit:#A6362F; --crit-soft:#F5E0DE; --crit-line:#DBA39E;
  --grid:#DFE5EC; --hatch:#C3CCD7;
  --shadow:0 1px 2px rgba(13,19,27,.06), 0 8px 24px -12px rgba(13,19,27,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#080D14; --surface:#101822; --surface-2:#0C131C; --surface-3:#16202C;
    --line:#22303F; --line-soft:#1A2531;
    --ink:#E3E9F1; --ink-2:#A5B3C4; --ink-3:#74829A;
    --accent:#3FB6C7; --accent-2:#5FCBDA; --accent-soft:#0F2A31; --accent-line:#1E4E58;
    --good:#4CBA85; --good-soft:#0F2A1E; --good-line:#245A40;
    --warn:#DFA43F; --warn-soft:#2B2110; --warn-line:#5C4520;
    --crit:#E4736A; --crit-soft:#2E1614; --crit-line:#63302C;
    --grid:#1C2836; --hatch:#2A3949;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#080D14; --surface:#101822; --surface-2:#0C131C; --surface-3:#16202C;
  --line:#22303F; --line-soft:#1A2531;
  --ink:#E3E9F1; --ink-2:#A5B3C4; --ink-3:#74829A;
  --accent:#3FB6C7; --accent-2:#5FCBDA; --accent-soft:#0F2A31; --accent-line:#1E4E58;
  --good:#4CBA85; --good-soft:#0F2A1E; --good-line:#245A40;
  --warn:#DFA43F; --warn-soft:#2B2110; --warn-line:#5C4520;
  --crit:#E4736A; --crit-soft:#2E1614; --crit-line:#63302C;
  --grid:#1C2836; --hatch:#2A3949;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size:15px; line-height:1.55; margin:0;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1200px; margin:0 auto; padding-inline:20px; padding-block:0}
h1,h2,h3,h4{text-wrap:balance; margin:0}
a{color:var(--accent)}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ============================================================ masthead */
header.mast{
  background:var(--surface); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:40;
}
.mast-in{display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding-block:14px}
.logo{display:flex; align-items:baseline; gap:10px}
.logo b{
  font-family:"IBM Plex Sans"; font-weight:700; font-size:19px;
  letter-spacing:.13em; color:var(--ink);
}
.logo span{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.mast-spacer{flex:1}
.gate{
  display:inline-flex; align-items:center; gap:8px; padding:5px 12px; border-radius:2px;
  font-size:11.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  border:1px solid var(--good-line); background:var(--good-soft); color:var(--good);
}
.gate.fail{border-color:var(--crit-line); background:var(--crit-soft); color:var(--crit)}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}

nav.tabs{display:flex; gap:2px; overflow-x:auto; border-top:1px solid var(--line-soft)}
nav.tabs button{
  appearance:none; background:none; border:0; border-bottom:2px solid transparent;
  color:var(--ink-3); font-family:inherit; font-size:13.5px; font-weight:500;
  padding:11px 15px; cursor:pointer; white-space:nowrap;
}
nav.tabs button:hover{color:var(--ink-2)}
nav.tabs button[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

/* ============================================================ sections */
main{padding-block:28px 64px}
section[role="tabpanel"]{display:flex; flex-direction:column; gap:26px}
.lede{
  font-family:"Newsreader", Georgia, serif; font-size:19.5px; line-height:1.5;
  color:var(--ink-2); max-width:66ch;
}
.lede em{color:var(--ink); font-style:italic}
.eyebrow{
  font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600;
}
h2.sec{font-size:20px; font-weight:600; letter-spacing:-.01em}
.sub{font-size:13.5px; color:var(--ink-3); max-width:74ch}

.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:3px;
  padding:20px; display:flex; flex-direction:column; gap:14px;
}
.panel.flush{padding:0}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}

/* ---- KPI tile: the FFU band is a structural edge, not a badge ---- */
.kpi{
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--ink-3);
  border-radius:3px; padding:15px 16px; display:flex; flex-direction:column; gap:5px;
}
.kpi.b-GREEN{border-left-color:var(--good)}
.kpi.b-AMBER{border-left-color:var(--warn)}
.kpi.b-RED{border-left-color:var(--crit)}
.kpi .k-label{font-size:11.5px; color:var(--ink-3); font-weight:500; line-height:1.35}
.kpi .k-val{
  font-family:"IBM Plex Sans"; font-size:29px; font-weight:600; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; line-height:1.1; color:var(--ink);
}
.kpi .k-val.sup{
  font-size:13px; font-weight:500; color:var(--ink-3); letter-spacing:.06em;
  background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 6px);
  padding:6px 9px; border-radius:2px; display:inline-block;
}
.kpi .k-meta{font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}

.band{
  display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600;
  letter-spacing:.09em; text-transform:uppercase; padding:2px 7px; border-radius:2px;
  border:1px solid; white-space:nowrap;
}
.band.GREEN{color:var(--good); background:var(--good-soft); border-color:var(--good-line)}
.band.AMBER{color:var(--warn); background:var(--warn-soft); border-color:var(--warn-line)}
.band.RED{color:var(--crit); background:var(--crit-soft); border-color:var(--crit-line)}
.band.NEUTRAL{color:var(--ink-3); background:var(--surface-3); border-color:var(--line)}

/* ---- score bars ---- */
.rowlist{display:flex; flex-direction:column}
.rowitem{
  display:grid; grid-template-columns:minmax(150px,1.5fr) minmax(90px,1fr) auto auto;
  gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line-soft);
}
.rowitem:last-child{border-bottom:0}
.rowitem .r-name{font-size:13px; color:var(--ink-2); line-height:1.35}
.rowitem .r-name b{color:var(--ink); font-weight:500}
.track{height:7px; background:var(--surface-3); border-radius:1px; overflow:hidden; min-width:70px}
.fill{height:100%; border-radius:1px}
.fill.GREEN{background:var(--good)} .fill.AMBER{background:var(--warn)} .fill.RED{background:var(--crit)}
.score{font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--ink-2); min-width:38px; text-align:right}

/* ---- tables ---- */
.tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:3px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:520px}
th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top}
th{
  font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
  font-weight:600; background:var(--surface-2); position:sticky; top:0;
}
tbody tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums; white-space:nowrap}

/* ---- agent transcript ---- */
.qa{border:1px solid var(--line); border-radius:3px; background:var(--surface); overflow:hidden}
.qa-q{
  display:flex; gap:12px; align-items:flex-start; padding:14px 16px;
  background:var(--surface-2); border-bottom:1px solid var(--line-soft);
}
.qa-q .qmark{
  font-family:"IBM Plex Mono"; font-size:11px; color:var(--accent); flex:none;
  border:1px solid var(--accent-line); background:var(--accent-soft);
  border-radius:2px; padding:1px 5px; margin-top:2px;
}
.qa-q h4{font-size:15px; font-weight:600; color:var(--ink); line-height:1.4}
.qa-body{padding:14px 16px; display:flex; flex-direction:column; gap:12px}
.answer{
  font-family:"Newsreader", Georgia, serif; font-size:16.5px; line-height:1.6;
  color:var(--ink); white-space:pre-wrap; max-width:74ch;
}
.answer.refusal{color:var(--ink-2)}
.qa-foot{
  display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center;
  padding-top:11px; border-top:1px solid var(--line-soft); font-size:11.5px; color:var(--ink-3);
}
.cite{
  font-family:"IBM Plex Mono"; font-size:11px; color:var(--ink-3);
  background:var(--surface-2); border:1px solid var(--line-soft);
  border-radius:2px; padding:2px 6px;
}
.cite b{color:var(--accent); font-weight:500}

/* ---- misc ---- */
.note{
  border-left:2px solid var(--accent); background:var(--accent-soft);
  padding:11px 14px; font-size:13.5px; color:var(--ink-2); border-radius:0 2px 2px 0;
}
.note b{color:var(--ink)}
.crit-note{border-left-color:var(--crit); background:var(--crit-soft)}
details{border:1px solid var(--line-soft); border-radius:2px; background:var(--surface-2)}
details summary{cursor:pointer; padding:8px 12px; font-size:12.5px; color:var(--ink-2); font-weight:500}
details summary:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
details .dbody{padding:0 12px 12px; font-size:13px; color:var(--ink-2); display:flex; flex-direction:column; gap:7px}
.chip{
  font-size:11px; padding:2px 7px; border-radius:2px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink-3); white-space:nowrap;
}
.chip.ok{color:var(--good); border-color:var(--good-line); background:var(--good-soft)}
.chip.no{color:var(--crit); border-color:var(--crit-line); background:var(--crit-soft)}
figure{margin:0; display:flex; flex-direction:column; gap:9px}
figcaption{font-size:12px; color:var(--ink-3); max-width:72ch}
.chartbox{overflow-x:auto}
svg{display:block; max-width:100%}
.tip{
  position:fixed; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--surface); border:1px solid var(--line); border-radius:3px;
  box-shadow:var(--shadow); padding:7px 10px; font-size:12px; color:var(--ink);
  z-index:80; max-width:230px;
}
.tip .t-k{color:var(--ink-3); font-size:11px}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:11.5px; color:var(--ink-3); align-items:center}
.legend i{width:11px; height:11px; border-radius:1px; display:inline-block; margin-right:5px; vertical-align:-1px}
footer{border-top:1px solid var(--line); margin-top:30px; padding-block:22px 40px; font-size:12px; color:var(--ink-3)}

@media (max-width:640px){
  .rowitem{grid-template-columns:1fr auto; gap:6px 10px}
  .rowitem .track{grid-column:1/2}
  .kpi .k-val{font-size:25px}
  .lede{font-size:17.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

Q-01","dimension":"completeness_days_supply","table":"claim_pharmacy","description":"Pharmacy claims with a missing or zero days_supply","value":7.05,"unit":"% of rows","rows_affected":21506,"score":36.9,"status":"FAIL","green_threshold":2.0,"red_threshold":10.0,"severity":"high","business_impact":"PDC adherence (M06) treats these rows as zero days of coverage, understating adherence and weakening the support-programme business case.","remediation":"Impute days_supply from quantity x standard pack size for the 11 highest-volume molecules; escalate the residual to the PBM vendor as a contractual data-quality defect.","owner":"RWD Data Engineering","exec_ms":141.8},{"check_id":"DQ-02","dimension":"plausibility_dates","table":"claim_medical","description":"Medical claims dated in the future","value":2.49,"unit":"% of rows","rows_affected":11974,"score":51.2,"status":"WARN","green_threshold":0.1,"red_threshold":5.0,"severity":"high","business_impact":"Future-dated claims inflate the most recent periods of every trend, which is precisely the window launch leadership reads first.","remediation":"Add a hard ingestion reject for service_date > ingest_date and quarantine the affected rows for vendor replay.","owner":"RWD Data Engineering","exec_ms":121.6},{"check_id":"DQ-03","dimension":"plausibility_units","table":"ehr_encounter","description":"Eosinophil counts implausible for 10^9/L (likely submitted in cells/uL)","value":4.68,"unit":"% of non-null labs","rows_affected":3096,"score":44.3,"status":"FAIL","green_threshold":0.5,"red_threshold":8.0,"severity":"high","business_impact":"Type 2 biomarker phenotyping silently mis-classifies these patients as eosinophilic, corrupting any biomarker-defined sub-cohort.","remediation":"Apply a UCUM unit-harmonisation rule at ingestion and back-convert values above 20 by dividing by 1000.","owner":"Clinical Data Products","exec_ms":68.4},{"check_id":"DQ-04","dimension":"completeness_clinical","table":"ehr_encounter","description":"Encounters for dermatology patients with no EASI severity score","value":40.01,"unit":"% of encounters","rows_affected":29436,"score":50.0,"status":"FAIL","green_threshold":20.0,"red_threshold":60.0,"severity":"medium","business_impact":"Severity-stratified effectiveness analyses can only be run on the minority of encounters that carry a score, and that minority skews to specialist care.","remediation":"Negotiate structured EASI capture in the next EHR network contract cycle; in the interim derive proxy severity from treatment intensity and document the proxy in the dictionary.","owner":"Clinical Data Products","exec_ms":141.5},{"check_id":"DQ-05","dimension":"timeliness","table":"source_metadata","description":"Worst publication lag across contracted sources against the 30-day SLA","value":62,"unit":"days","rows_affected":2,"score":28.9,"status":"FAIL","green_threshold":30.0,"red_threshold":75.0,"severity":"high","business_impact":"Any metric that depends on the QC provincial feed is structurally two months stale, so QC cannot be compared like-for-like against other provinces in a monthly review.","remediation":"Either re-contract for a 30-day feed or publish QC on a separate, explicitly lagged panel. Do not blend silently.","owner":"RWD Data Sourcing & Contracts","exec_ms":0.4},{"check_id":"DQ-06","dimension":"deduplication","table":"claim_medical","description":"Exact duplicate medical claim rows","value":1.48,"unit":"% of rows","rows_affected":7110,"score":52.4,"status":"WARN","green_threshold":0.1,"red_threshold":3.0,"severity":"high","business_impact":"Duplicates inflate utilisation and cost metrics (M08, M11), which are the two numbers the payer dossier rests on.","remediation":"Add a deterministic dedupe on the natural key (patient_id, service_date, proc_code, paid_amount) in the silver layer, and assert uniqueness in the pipeline tests.","owner":"RWD Data Engineering","exec_ms":488.2},{"check_id":"DQ-07","dimension":"conformance_codes","table":"patient","descr <script>
/* ============================================================ helpers */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,a={},...kids)=>{
  const n=document.createElement(t);
  for(const [k,v] of Object.entries(a)){
    if(v==null) continue;
    if(k==="class") n.className=v; else if(k==="html") n.innerHTML=v; else n.setAttribute(k,v);
  }
  for(const c of kids.flat()) if(c!=null) n.append(c.nodeType?c:document.createTextNode(c));
  return n;
};
const NS="http://www.w3.org/2000/svg";
const s = (t,a={})=>{const n=document.createElementNS(NS,t); for(const[k,v] of Object.entries(a)) if(v!=null) n.setAttribute(k,v); return n;};
const fmtN = n => (n==null?"—":Number(n).toLocaleString());
const pct1 = v => (v*100).toFixed(1)+"%";
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const tip = $("#tip");
function showTip(e, html){
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - 10;
  if(x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if(y + r.height > innerHeight - 8) y = innerHeight - r.height - 8;
  tip.style.left = Math.max(8,x)+"px"; tip.style.top = Math.max(8,y)+"px";
}
const hideTip = ()=> tip.style.opacity = 0;
function hoverable(node, html){
  node.addEventListener("mousemove", e=>showTip(e,html));
  node.addEventListener("mouseleave", hideTip);
  node.style.cursor = "crosshair";
}

/* ============================================================ charts */

/* Single-series monthly trend. Two kinds of unreliability are drawn
   differently on purpose: months the privacy policy suppressed, and months
   the metric's own caveat says are understated by claim run-off. */
function trendChart(series, opts={}){
  const W = 720, H = 260, P = {t:16, r:64, b:34, l:46};
  const iw = W-P.l-P.r, ih = H-P.t-P.b;
  const live = series.filter(p=>!p.suppressed);
  const max = Math.max(0.2, Math.ceil((Math.max(...live.map(p=>p.value))+0.02)*10)/10);
  const x = i => P.l + (series.length<2 ? iw/2 : i*iw/(series.length-1));
  const y = v => P.t + ih - (v/max)*ih;
  const svg = s("svg",{viewBox:`0 0 ${W} ${H}`, width:W, role:"img",
                       "aria-label":opts.aria||"Monthly trend"});
  const defs = s("defs"); svg.append(defs);
  const grad = s("linearGradient",{id:"gArea", x1:0,y1:0,x2:0,y2:1});
  grad.append(s("stop",{offset:"0%", style:"stop-color:var(--accent); stop-opacity:.26"}));
  grad.append(s("stop",{offset:"100%", style:"stop-color:var(--accent); stop-opacity:.02"}));
  defs.append(grad);
  const hatch = s("pattern",{id:"gHatch", width:6, height:6, patternUnits:"userSpaceOnUse", patternTransform:"rotate(135)"});
  hatch.append(s("rect",{width:6,height:6,fill:"transparent"}));
  hatch.append(s("line",{x1:0,y1:0,x2:0,y2:6, style:"stroke:var(--hatch)","stroke-width":2}));
  defs.append(hatch);

  // y grid + ticks
  const ticks = Math.round(max*10);
  for(let i=0;i<=ticks;i++){
    const v = max*i/ticks;
    svg.append(s("line",{x1:P.l,x2:W-P.r,y1:y(v),y2:y(v), style:"stroke:var(--grid)","stroke-width":1}));
    svg.append(el2text(P.l-8, y(v)+4, (v*100).toFixed(0)+"%", {anchor:"end"}));
  }
  // suppressed / caveat bands
  const supIdx = series.map((p,i)=>p.suppressed?i:-1).filter(i=>i>=0);
  supIdx.forEach(i=>{
    const x0 = x(Math.max(0,i-0.5)), x1 = x(Math.min(series.length-1,i+0.5));
    svg.append(s("rect",{x:x0, y:P.t, width:Math.max(3,x1-x0), height:ih, fill:"url(#gHatch)", opacity:.7}));
  });
  if(opts.runoff){
    const i0 = series.length-opts.runoff;
    const x0 = x(Math.max(0,i0-0.5));
    const r = s("rect",{x:x0, y:P.t, width:(W-P.r)-x0, height:ih,
                        style:"fill:var(--warn); opacity:.09"});
    svg.append(r);
    svg.append(s("line",{x1:x0,x2:x0,y1:P.t,y2:P.t+ih, style:"stroke:var(--warn)",
                         "stroke-width":1,"stroke-dasharray":"3 3"}));
    svg.append(el2text(x0-6, P.t+13, "claim run-off",
                       {size:10.5, fill:"var(--warn)", weight:600, anchor:"end"}));
  }
  // area + line through live points only
  const pts = live.map(p=>[x(series.indexOf(p)), y(p.value)]);
  if(pts.length){
    const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    svg.append(s("path",{d:`${d} L ${pts[pts.length-1][0].toFixed(1)} ${P.t+ih} L ${pts[0][0].toFixed(1)} ${P.t+ih} Z`,
                         fill:"url(#gArea)", stroke:"none"}));
    svg.append(s("path",{d, style:"fill:none; stroke:var(--accent)", "stroke-width":2,
                         "stroke-linejoin":"round","stroke-linecap":"round"}));
  }
  // markers
  series.forEach((p,i)=>{
    if(p.suppressed) return;
    const last = i===series.length-1;
    const c = s("circle",{cx:x(i), cy:y(p.value), r:last?5:3.4,
                          style:`fill:${last?"var(--accent)":"var(--surface)"}; stroke:var(--accent)`,
                          "stroke-width":2});
    hoverable(c, `<div><b>${p.period}</b></div>
      <div class="t-k">share of new starts</div><div>${pct1(p.value)}</div>
      <div class="t-k">new starts in month</div><div>${fmtN(p.n)}</div>`);
    svg.append(c);
  });
  // endpoint label
  const lastLive = live[live.length-1];
  if(lastLive){
    const i = series.indexOf(lastLive);
    const near = x(i) + 46 > W - P.r;          // no room to the right
    svg.append(el2text(near ? x(i)-9 : x(i)+9, y(lastLive.value)-9,
      pct1(lastLive.value),
      {size:12.5, weight:600, fill:"var(--accent)", anchor: near?"end":"start"}));
  }
  // x labels: first, quarterly, last
  series.forEach((p,i)=>{
    const last = i===series.length-1;
    if(i%3!==0 && !last) return;
    svg.append(el2text(x(i), H-12, p.period,
      {anchor: last?"end":(i===0?"start":"middle"), size:10.5}));
  });
  svg.append(s("line",{x1:P.l,x2:W-P.r,y1:P.t+ih,y2:P.t+ih, style:"stroke:var(--line)","stroke-width":1}));
  return svg;
}
function el2text(x,y,txt,o={}){
  const t = s("text",{x, y, "text-anchor":o.anchor||"start",
    "font-size":o.size||11, "font-weight":o.weight||400,
    style:`fill:${o.fill||"var(--ink-3)"}`, "font-family":"IBM Plex Mono, monospace"});
  t.textContent = txt; return t;
}

/* Horizontal magnitude bars. Sequential opacity ramp on one hue = magnitude. */
function barChart(rows, opts={}){
  const rowH = 25, P = {t:opts.ref!=null?24:8, r:58, b:22, l:opts.labelW||54};
  const W = 720, H = P.t + rows.length*rowH + P.b;
  const iw = W - P.l - P.r;
  const max = Math.max(...rows.map(r=>r.value||0)) * 1.02 || 1;
  const svg = s("svg",{viewBox:`0 0 ${W} ${H}`, width:W, role:"img",
                       "aria-label":opts.aria||"Comparison"});
  const hue = opts.hue || "var(--accent)";
  rows.forEach((r,i)=>{
    const yy = P.t + i*rowH;
    svg.append(el2text(P.l-9, yy+16, r.label, {anchor:"end", size:11.5, fill:"var(--ink-2)"}));
    if(r.suppressed){
      const g = s("rect",{x:P.l, y:yy+5, width:iw*0.22, height:13, rx:2,
                          fill:"url(#gHatch)", style:"stroke:var(--line)"});
      svg.append(g);
      svg.append(el2text(P.l+iw*0.22+8, yy+16, "suppressed", {size:10.5}));
      return;
    }
    const w = Math.max(2, (r.value/max)*iw);
    const op = 0.42 + 0.58*(r.value/max);          // ramp carries magnitude
    const bar = s("rect",{x:P.l, y:yy+4, width:w, height:15, rx:2, style:`fill:${hue}; opacity:${op}`});
    hoverable(bar, `<div><b>${r.label}</b></div><div>${r.display}</div>
      <div class="t-k">denominator</div><div>${fmtN(r.n)}</div>${r.hash?`<div class="t-k mono">${r.hash}</div>`:""}`);
    svg.append(bar);
    svg.append(el2text(P.l+w+8, yy+16, r.display, {size:11.5, weight:500, fill:"var(--ink-2)"}));
  });
  if(opts.ref!=null){
    const rx = P.l + (opts.ref/max)*iw;
    svg.append(s("line",{x1:rx,x2:rx,y1:P.t-6,y2:H-P.b+2, style:"stroke:var(--ink-3)",
                         "stroke-width":1,"stroke-dasharray":"4 3"}));
    svg.append(el2text(rx+5, P.t-10, opts.refLabel||"reference", {size:10.5}));
  }
  const defs = s("defs");
  const hatch = s("pattern",{id:"gHatch2", width:6, height:6, patternUnits:"userSpaceOnUse", patternTransform:"rotate(135)"});
  hatch.append(s("line",{x1:0,y1:0,x2:0,y2:6, style:"stroke:var(--hatch)","stroke-width":2}));
  defs.append(hatch); svg.append(defs);
  svg.querySelectorAll('[fill="url(#gHatch)"]').forEach(n=>n.setAttribute("fill","url(#gHatch2)"));
  return svg;
}

function scoreRow(name, sub, score, band, right){

    el("div",{class:"score"}, score.toFixed(1)),
    right||el("span",{class:"band "+band}, band));

    el("div",{class:"panel"}, list)
  );
}

/* ---------------------------------------------------- Agent */
{
  const p = panels.agent;
  p.append(
    el("div",{}, el("h2",{class:"sec"}, "Ask HELIOS"),
      el("p",{class:"sub"}, "Real answers from the running system, including the ones it refused. Four of the five ways a question can end are refusals — that ratio is deliberate.")),
    ...DATA.agent_answers.map(a=>{
      const refused = a.status!=="answered";
      const foot = el("div",{class:"qa-foot"});
      if(!refused){
        foot.append(el("span",{class:"band "+a.band}, a.band+" · "+a.ffu_score));
        (a.citations||[]).slice(0,4).forEach(c=>foot.append(
          el("span",{class:"cite"}, el("b",{},c.cohort_hash), ` n=${fmtN(c.denominator)}`)));
        if((a.citations||[]).length>4) foot.append(el("span",{class:"cite"}, `+${a.citations.length-4} more cells`));
        foot.append(el("span",{}, `${a.claims} numeric claims verified · groundedness ${a.groundedness}`));
      } else {
        foot.append(el("span",{class:"band RED"},
          a.status==="refused_not_fit"?"Refused — not fit":"Refused — out of scope"));
      }
      foot.append(el("span",{}, `${Math.round(a.latency_ms)} ms`));
      if(a.metric_id) foot.append(el("span",{class:"mono", style:"font-size:11px"}, a.metric_id));
      return el("div",{class:"qa"},
        el("div",{class:"qa-q"}, el("span",{class:"qmark"},"Q"), el("h4",{}, a.question)),
        el("div",{class:"qa-body"},
          el("div",{class:"answer"+(refused?" refusal":"")}, a.narrative), foot));
    })
  );
}

/* ---------------------------------------------------- Assurance */
{
  const p = panels.assurance, ev = DATA.evaluation, tl = DATA.telemetry;
  const gt = el("table",{});
  gt.append(el("thead",{}, el("tr",{}, ["Gate","Observed","Threshold","Result"].map(h=>el("th",{},h)))));
  const gb = el("tbody",{});
  ev.findings.forEach(f=>gb.append(el("tr",{},
    el("td",{}, el("span",{class:"mono", style:"font-size:12px"}, f.metric)),
    el("td",{class:"n"}, String(f.value)),
    el("td",{class:"n"}, String(f.threshold)),
    el("td",{}, el("span",{class:"chip "+(f.passed?"ok":"no")}, f.passed?"PASS":"FAIL")))));
  gt.append(gb);

  const cat = {};
  ev.rows.forEach(r=>{ (cat[r.category] ||= []).push(r); });
  const catList = el("div",{class:"rowlist"});
  Object.entries(cat).forEach(([c,rs])=>{
    const ok = rs.filter(r=>r.routing_ok && r.refusal_ok && r.gate_ok && r.suppression_ok && !r.safety_violation).length;
    catList.append(scoreRow(c.replace(/_/g," "), `${rs.length} cases`, 100*ok/rs.length,
      ok===rs.length?"GREEN":"RED", el("span",{class:"chip "+(ok===rs.length?"ok":"no")}, `${ok}/${rs.length}`)));
  });

  const st = tl.stage_latency;
  p.append(
    el("div",{}, el("h2",{class:"sec"}, "Assurance"),
      el("p",{class:"sub"}, "How we decided this is good enough to ship, and how we would know it stopped being so.")),
    el("div",{class:"grid g2"},
      el("div",{class:"panel"},
        el("div",{class:"eyebrow"},"Release gate"),
        el("div",{class:"tblwrap"}, gt),
        el("p",{class:"sub"}, "Thresholds are deliberately asymmetric. Routing may be imperfect and still ship, because a mis-routed answer is caught by the reader in seconds. Groundedness and safety may not, because a wrong number looks exactly like a right one.")),
      el("div",{class:"panel"},
        el("div",{class:"eyebrow"},"Golden set by category"),
        catList,
        el("p",{class:"sub"}, `${ev.scores.cases} cases authored from the business-question register, not from current system behaviour. A case that starts failing is a regression, not a re-baseline.`))),
    el("div",{class:"panel"},
      el("div",{class:"eyebrow"},"The eval suite earned its place"),
      el("p",{style:"font-size:14px;color:var(--ink-2);margin:0;max-width:74ch"},
        "It found four real defects in the system it was written to measure: two safety violations (a share-price question and a request to draft promotional copy were both answered with brand-share data), a false refusal in the scope guard itself (it was blocking “cost per patient year”, a population metric), verifier false positives on governed labels such as “per 100 patients”, and — most dangerous — a question about Prince Edward Island that returned a confident national figure because no alias mapped the province name. An eval that only confirms what you already believe is decoration.")),
    el("div",{class:"grid g2"},
      el("div",{class:"panel"},
        el("div",{class:"eyebrow"},"Where the time goes"),
        el("div",{class:"rowlist"},
          ...Object.entries(st).filter(([,v])=>v!=null).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
            el("div",{class:"rowitem"},
              el("div",{class:"r-name"}, el("b",{}, k)),
              el("div",{class:"track"}, el("div",{class:"fill GREEN",
                style:`width:${Math.min(100, 100*v/Math.max(...Object.values(st).filter(Boolean)))}%;background:var(--accent)`})),
              el("div",{class:"score"}, v+" ms"), el("span",{})))),
        el("p",{class:"sub"}, "Per-stage timing matters more than the total. When p95 sat at 5.5 seconds the split showed it was entirely break-out fan-out — eleven provincial cohorts each re-scanning the patient spine. Cohort indexes took p95 to about 1.4 seconds. A single total would have prompted a guess.")),
      el("div",{class:"panel"},
        el("div",{class:"eyebrow"},"Adversarial suite"),
        el("div",{class:"rowlist", style:"font-size:13.5px"},
          ...[["Injected figure caught","161 → 940 days, and the subtle 161 → 167"],
              ["SQL injection contained","question text never reaches a SQL string"],
              ["Write statements blocked","read-only guard raises at the access layer"],
              ["Malicious plan sanitised","unknown metric, ssn filter and patient_id break-out all stripped"],
              ["Small cells suppressed","no underlying value present in the response object"],
              ["Identifiers scrubbed","patient ids, postal codes and emails removed from generated text"]]
            .map(([k,v])=>el("div",{class:"rowitem", style:"grid-template-columns:1fr auto"},
              el("div",{class:"r-name"}, el("b",{},k), el("div",{style:"font-size:11.5px;color:var(--ink-3)"}, v)),
              el("span",{class:"chip ok"},"pass")))),
        el("p",{class:"sub"}, "22 assertions run beside the golden set on every change.")))
  );
}

document.body.append(el("footer",{}, el("div",{class:"wrap"},
  el("div",{}, `Generated ${DATA.meta.generated_at} · semantic layer v${DATA.meta.semantic_layer_version} · ${DATA.meta.warehouse_queries} queries, ${fmtN(DATA.meta.warehouse_rows_scanned)} rows scanned in this run.`),
  el("div",{style:"margin-top:6px"}, "All data is synthetic and generated for this project. SANOVIA is a fictional brand. No real patient, prescriber, payer or product data is used, and nothing here represents any real company's data, products or performance."))));
</script>
